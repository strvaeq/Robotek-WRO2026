# Reference configuration of the Obstacle Challenge controller.
#
# SOURCE OF TRUTH: src/renkay_obstacle/renkay_obstacle/config.py (dataclass Config).
# The node does NOT read ROS parameters: its constructor builds Config() with
# the values below. This file repeats those values with units so the whole
# tuning is readable in one place. Editing this file does not change the robot
# until the same number is copied into config.py.
#
# Sign convention (config.py docstring): positive theta and delta (steering
# angle) mean a right turn. wall_side 'right' follows the right wall, 'left'
# the left wall; a red block selects the right wall and a green block the left.

# --- inner loop: IMU heading -> steering angle ------------------------------
KP_IN: 1.8                    # deg steering per deg of heading error, dimensionless
KD_IN: 0.22                   # deg steering per deg/s of gyro rate, s
DELTA_MAX_DEG: 30.0           # deg, mechanical steering limit

# --- steering servo (RRC Lite acker_servo) ----------------------------------
SERVO_CENTER_US: 1500.0       # us, straight ahead
SERVO_MIN_US: 1000.0          # us, hard limit
SERVO_MAX_US: 2050.0          # us, hard limit
SERVO_GAIN_POS: 18.3333       # us/deg, = 550 us / 30 deg
SERVO_GAIN_NEG: 16.6667       # us/deg, = 500 us / 30 deg
SERVO_SIGN: -1.0              # dimensionless, -1.0 flips the steering direction
SERVO_CMD_S: 0.06             # s, duration field sent with every servo command

# --- gyroscope --------------------------------------------------------------
GYRO_SIGN: -1.0               # dimensionless, flips the sensor sign to the right-turn-positive convention
GYRO_CAL_S: 4.0               # s of still samples averaged at start-up for the bias

# --- LiDAR beams ------------------------------------------------------------
LIDAR_FRONT_DEG: 180.0        # deg, straight ahead
LIDAR_RIGHT_DEG: 120.0        # deg
LIDAR_LEFT_DEG: 240.0         # deg
LIDAR_REAR_DEG: 0.0           # deg, rear beam, used only by the parking manoeuvre
LIDAR_WINDOW_HALF_DEG: 10.0   # deg, half width of the median window
LIDAR_MIN_M: 0.05             # m, readings closer than this are discarded
LIDAR_MAX_M: 3.3              # m, readings farther than this are discarded

# --- wall following ---------------------------------------------------------
TARGET_M: 0.18                # m, wanted distance to the followed wall
SIDE_RAY_DEG: 60.0            # deg, lateral beam used for the wall fit
FORWARD_RAY_DEG: 30.0         # deg, forward beam used for the wall fit
WALL_MAX_ANGLE_DEG: 55.0      # deg, a wall fit steeper than this is rejected
WALL_MAX_DIST_M: 0.90         # m, a wall farther than this is rejected
WALL_JUMP_MAX_M: 0.35         # m, a one-frame distance jump larger than this is a pillar return and is rejected
LATERAL_GAIN: 1.5             # m^-1 inside atan(), distance error to heading
FOLLOW_MAX_DEG: 7.0           # deg, clamp of the heading requested by the follower

# --- pillar avoidance (colour vision) ---------------------------------------
BLOCK_TIMEOUT_S: 1.5          # s, a camera block older than this is ignored
PILLAR_NEAR_BASE: 0.5         # dimensionless, block base line below this = far, no nudge (1.0 = bottom of image)
PILLAR_GAIN_DEG: 14.0         # deg of nudge per unit of normalised horizontal offset
PILLAR_MAX_DEG: 12.0          # deg, clamp of the nudge
CONFIRM_FRAMES: 3             # frames, consecutive frames needed to accept a colour

# --- colour detection (HSV, OpenCV 8-bit ranges) ----------------------------
RED_H1_LOW: 0                 # hue, first red range, OpenCV scale 0..180
RED_H1_HIGH: 13                # hue
RED_H2_LOW: 169               # hue, second red range (red wraps around the hue circle)
RED_H2_HIGH: 180              # hue
RED_S_MIN: 80                 # saturation 0..255
RED_V_MIN: 50                 # value 0..255
GREEN_H_LOW: 53               # hue
GREEN_H_HIGH: 89              # hue
GREEN_S_MIN: 25               # saturation 0..255
GREEN_V_MIN: 25               # value 0..255
COLOR_MIN_AREA_PX: 650        # px^2, smaller contours are noise
COLOR_MIN_FILL: 0.42          # contour area / bounding box area, below this the blob is rejected
COLOR_MAX_WIDTH_HEIGHT: 2.6   # ratio, longer blobs are rejected
COLOR_MORPH_KERNEL: 7         # px, side of the square morphology kernel
COLOR_MORPH_ITERS: 2          # iterations of the open and close operations
CAMERA_TOPIC: /usb_cam/image_raw  # topic subscribed by the Obstacle node

# --- corners ----------------------------------------------------------------
CORNER_FRONT_M: 0.65          # m, front wall distance that can trigger a turn
CORNER_COOLDOWN_S: 1.5        # s, minimum time between two turns
CORNER_MAX_THETA_REL_DEG: 15.0  # deg, corners are ignored when the heading offset is larger
CORNER_EXIT_MARGIN_DEG: 4.0   # deg, turn counts as done inside this band around the new heading
CORNER_EXIT_MAX_GZ_DEG_S: 20.0  # deg/s, turn also requires the rotation to have slowed down
CORNER_TIMEOUT_S: 3.3         # s, a turn longer than this stops the car
SIDE_OPEN_M: 1.2              # m, a side beam beyond this distance means an opening

# --- drive motor ------------------------------------------------------------
MOTOR_CRUISE_PCT: 35.0        # % of full duty on straights (slower than the Open run)
MOTOR_TURN_PCT: 35.0          # % of full duty during a corner

# --- laps -------------------------------------------------------------------
# A lap is counted from confirmed corner exits, not from integrated yaw.
MAX_LAPS: 3                   # laps
CORNERS_PER_LAP: 4            # corners, one per 90 deg turn
LAP_MARGIN_DEG: 10.0          # deg, declared in config.py but not read by the current code
LAP_BEEP_FREQ: 523            # Hz, buzzer note after each lap
FINISH_BEEP_FREQ: 784         # Hz, buzzer note at the end

# --- parking (after the last lap) -------------------------------------------
PARKING_ENABLED: True         # bool, run the parallel parking state machine after lap MAX_LAPS
PARK_SLOT_LEN_M: 0.60         # m, rear clearance that identifies the parking slot
PARK_TARGET_GAP_M: 0.15       # m, wanted lateral gap to the wall when parked
PARK_REVERSE_PCT: 25.0        # % of full duty while reversing into the slot
PARK_ABORT_FRONT_M: 0.10      # m, abort the manoeuvre below this front clearance
PARK_MAX_TIME_S: 8.0          # s, abort the manoeuvre after this time
PARK_STEER_SIGN: -1.0         # dimensionless, flips the steering direction of the parking arcs

# --- timing -----------------------------------------------------------------
SCAN_DT: 0.1                  # s, nominal LiDAR period (~10 Hz)
IMU_TIMEOUT_S: 0.20           # s, no IMU message for longer than this latches a fault
LIDAR_TIMEOUT_S: 0.35         # s, no scan message for longer than this latches a fault
WATCHDOG_S: 0.05              # s, period of the safety timer
FAULT_RECOVERY_S: 1.0         # s, both sensors must be valid this long before a latched fault clears

# --- node constants (robot_node.py, not in config.py) -----------------------
BUTTON_MIN_INTERVAL_S: 1.5    # s, debounce between two RRC Lite button presses
